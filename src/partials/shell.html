<!doctype html>
<!-- Generated by build.py from src/ — edit the files in src/, then run: python3 build.py -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />
  <meta name="theme-color" content="#0b1a2e" />
  <link rel="icon" href="images/ptc-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    // Before first paint: skip the long preloader once this session has seen it
    (function () {
      var d = document.documentElement;
      d.classList.add('js');
      try { if (sessionStorage.getItem('ptc-visited')) d.classList.add('is-returning'); } catch (e) {}
    })();
  </script>
</head>
<body class="is-loading" data-page="{{slug}}">

  <!-- First visit: the tower draws itself while the years count up -->
  <div class="loader" aria-hidden="true">
    <svg class="loader__tower" viewBox="0 0 120 160" fill="none">
      <path d="M20 155 V48 H30 V36 H42 V48 H54 V36 H66 V48 H78 V36 H90 V48 H100 V155 Z" />
      <path d="M48 155 V122 a12 12 0 0 1 24 0 V155" />
      <rect x="44" y="62" width="32" height="34" rx="2" />
      <path d="M60 68 V90 M50 79 H70" />
      <path d="M4 155 H116" />
    </svg>
    <div class="loader__count">1902</div>
    <div class="loader__caption"><span>Princeton Tower Club</span><span class="loader__125">Celebrating 125 years</span></div>
    <div class="loader__bar"><span></span></div>
  </div>

  <!-- Page-to-page transition -->
  <div class="curtain" aria-hidden="true">
    <span class="logo-mark"></span>
    <span class="curtain__label">{{label}}</span>
  </div>

  <div class="progress" aria-hidden="true"><span></span></div>
  <div class="cursor" aria-hidden="true"><span class="cursor__label"></span></div>

{{header}}

  <main id="top">
{{content}}
{{next}}
  </main>

{{footer}}

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
